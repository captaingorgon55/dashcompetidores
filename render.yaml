# Render.com Deployment Configuration
# Competitor Dashboard — El Espectador & Revista VEA

services:
  - type: web
    name: competitor-dashboard
    runtime: python
    region: ohio
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DEBUG
        value: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SITE_URL
        value: sc-domain:elespectador.com
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
